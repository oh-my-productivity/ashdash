name: advisories

# RustSec advisories (vulnerabilities, unsound, unmaintained and yanked crates) for the locked dependency graph.
# Kept out of the pull-request checks on purpose: an advisory published tomorrow says nothing about today's
# change. This job fails visibly (red run, and GitHub e-mails the people watching Actions failures); it opens no
# issues and writes nothing. To accept a known problem add it to `ignore` in deny.toml with a reason.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisories-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
