name: ci

# The cheap checks, on every pull request and every push to main. What runs where is in docs/TESTING.md (the policy) and docs/CI.md.
#   check        scripts/check.sh: the local gate (fmt, clippy, unit and integration tests, commit-lint tests, policy). Required status check.
#   deny         licences, banned crates, sources. Required status check.
#   commit-lint  the pull request title and every commit message (Conventional Commits).
#   hooks        the tests of the git hooks (real commits in throw-away repositories, about a minute).
#   policy       the testing policy: scripts/policy-check.sh and the tests of the policy tooling.
#   packaging    packaging self-test, NOTICE, shellcheck/actionlint, and the tests of the e2e scripts.
# The end-to-end jobs are in e2e.yml, stress and performance in stress.yml, the soak in soak.yml. Fork pull requests get this file only:
# the others drive a GUI session on a hosted runner and are limited to branches of this repository (docs/TESTING.md).
#
# Security (public repository): only `pull_request` (never `pull_request_target`), read-only token, no secrets in this file, every
# third-party action pinned by commit SHA (the comment names the release), a timeout on every job, superseded runs are cancelled.
# The pull request title and the branch name are attacker-controlled text: they reach the shell only through environment variables.
on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-runs the title check; every other job is skipped for it (a skipped required check counts as passed)
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a title edit gets a group of its own, so that it never cancels the run of the code it is about
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && 'title' || 'code' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Required status check. Runs the local gate. A cold cache on a hosted runner is slower than a laptop with a warm one, so the budget
  # of check.sh is raised here (it may be raised on CI only); the stage times are in the job summary.
  check:
    if: github.event.action != 'edited'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CHECK_BUDGET_SECONDS: "900"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch "stable" at the time of pinning
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/check.sh

  # Required status check. Licences, banned crates and sources (deny.toml). Advisories are NOT checked here: a new RustSec entry for a
  # crate this change does not touch would turn every pull request red. They run weekly in advisories.yml.
  # The action is a Docker container, so it runs on Linux; deny.toml restricts the graph to the macOS targets.
  # Pinned by commit SHA (tag v2.1.1, cargo-deny 0.20.2).
  deny:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources

  # Conventional Commits (CONTRIBUTING.md, "Commit messages and pull requests"). Pull requests are squash-merged, so the TITLE becomes the
  # commit on main and the release version is computed from it; the commits inside the pull request are checked too, because the hooks that
  # check them locally can be skipped (git commit --no-verify). Not a required check until the maintainers add it to the ruleset.
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Dependabot writes titles such as "build(deps): bump the minor-and-patch group across 1 directory with 5 updates" and cannot
      # be configured to shorten them, so its pull requests get a longer header limit.
      COMMIT_LINT_MAX_HEADER: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '120' || '72' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base branch and the whole branch history are needed for the commit range
          persist-credentials: false
      - name: Pull request title
        run: scripts/commit-lint.sh --forbid-names --title "$PR_TITLE"
      - name: Commit messages of the pull request
        if: ${{ !cancelled() && github.event.action != 'edited' }}
        run: scripts/commit-lint.sh --forbid-names --range "refs/remotes/origin/$BASE_REF..$HEAD_SHA"

  # The tests of the git hooks and of the commit validator: about 40 s of real commits, too long for the local gate (which runs the
  # validator tests only), so they run here. On Linux; the macOS `check` job does not need them.
  hooks:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch "stable" at the time of pinning
        with:
          toolchain: stable
          components: rustfmt
      - run: tests/hooks/run-tests.sh

  # The testing policy (docs/TESTING.md): no non-ignored test and no script of the local gate does what only CI may do. Static, seconds.
  policy:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Policy check
        run: scripts/policy-check.sh --list-allowed
      - name: Tests of the policy check and of ci-run.sh
        run: tests/policy/run-tests.sh

  # Packaging inputs, the generated NOTICE, the linters for every shell script and workflow in the repository, and the tests of the
  # e2e scripts that need no GUI (guards, result classification).
  packaging:
    if: github.event.action != 'edited'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch "stable" at the time of pinning
        with:
          toolchain: stable
      - name: Packaging self-test
        run: packaging/selftest.sh
      - name: NOTICE is up to date
        run: scripts/gen-notice.py --check
      # Pinned releases, verified against the SHA-256 of the tarball (arm64 macOS; the runner is arm64).
      - name: Install shellcheck 0.11.0 and actionlint 1.7.12
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/lint-tools"; mkdir -p "$tools"; cd "$tools"
          fetch() { # fetch <url> <sha256> <file>
            curl --fail --silent --show-error --location --retry 3 --output "$3" "$1"
            echo "$2  $3" | shasum -a 256 -c -
          }
          fetch https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.aarch64.tar.xz \
            56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79 shellcheck.tar.xz
          fetch https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_darwin_arm64.tar.gz \
            aba9ced2dee8d27fecca3dc7feb1a7f9a52caefa1eb46f3271ea66b6e0e6953f actionlint.tar.gz
          tar -xf shellcheck.tar.xz
          tar -xzf actionlint.tar.gz
          echo "$tools/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          echo "$tools" >> "$GITHUB_PATH"
      - name: shellcheck and actionlint
        run: scripts/ci/lint.sh
      - name: Tests of the e2e scripts
        run: tests/e2e/test/run-tests.sh
