name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh
  # Licences, advisories, banned crates and sources (deny.toml). The action is a Docker container, so
  # it runs on Linux; deny.toml restricts the graph to the macOS targets. Pinned by commit SHA (tag v2.1.1,
  # cargo-deny 0.20.2). Verified locally with `cargo deny check` 0.20.2.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses bans sources advisories
