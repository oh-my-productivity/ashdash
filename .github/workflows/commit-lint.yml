name: commit-lint

# Conventional Commits (CONTRIBUTING.md, "Commit messages and pull requests"). Pull requests are squash-merged, so the TITLE becomes the
# commit on main and the release version is computed from it; the commits inside the pull request are checked too, because the hooks that
# check them locally can be skipped (git commit --no-verify).
#   commit-lint   the pull request title and every commit message of the pull request (scripts/commit-lint.sh).
#   hooks-tests   the tests of the validator and of the git hooks, on Linux (the macOS `check` job runs them through scripts/check.sh).
# Not a required check until the maintainers add it to the ruleset.
#
# Security: only `pull_request` (never `pull_request_target`), read-only token, no secrets. The title and the branch name are
# attacker-controlled text: they reach the shell only through environment variables, never through ${{ }} inside a script.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commit-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Dependabot writes titles such as "build(deps): bump the minor-and-patch group across 1 directory with 5 updates" and cannot
      # be configured to shorten them, so its pull requests get a longer header limit.
      COMMIT_LINT_MAX_HEADER: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '120' || '72' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base branch and the whole branch history are needed for the commit range
          persist-credentials: false
      - name: Pull request title
        run: scripts/commit-lint.sh --forbid-names --title "$PR_TITLE"
      - name: Commit messages of the pull request
        if: ${{ !cancelled() }}
        run: scripts/commit-lint.sh --forbid-names --range "refs/remotes/origin/$BASE_REF..$HEAD_SHA"

  hooks-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch "stable" at the time of pinning
        with:
          toolchain: stable
          components: rustfmt
      - run: tests/hooks/run-tests.sh
