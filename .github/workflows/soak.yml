name: soak

# The soak (tests/e2e/qa/soak.sh): the real app on a hosted macOS runner for two hours, show, type and hide every 30 seconds, then the
# hotkey must still work, no press may be missed and the process must still be alive. Nightly and on demand:
#   scripts/ci-run.sh soak --watch [--soak-seconds 600]
# Dispatch inputs: `soak_seconds` (7200 = the 2-hour version), `ref` (branch, tag or SHA to test; empty = the dispatched ref).
#
# Security (public repository): read-only token, no secrets, every action pinned by commit SHA, a timeout, superseded runs are cancelled,
# logs and screenshots are uploaded for failures only (7 days).
on:
  schedule:
    - cron: "41 4 * * *" # every day 04:41 UTC
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: "Soak duration in seconds (7200 = the 2-hour version)"
        type: string
        default: "7200"
        required: false
      ref:
        description: "Branch, tag or SHA to test (empty = the dispatched ref)"
        type: string
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  soak:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch "stable" at the time of pinning
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: soak
      - name: Soak
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds || '7200' }}
        run: bash tests/e2e/ci/run-soak.sh "$SOAK_SECONDS" 30
      - name: Upload logs and screenshots (failures only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak
          path: ${{ runner.temp }}/ashdash-ci/soak
          retention-days: 7
          if-no-files-found: ignore
