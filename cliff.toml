# git-cliff configuration (pinned version: scripts/release/tools.env).
#
# This file encodes the release policy of docs/RELEASING.md. It is used by
#   scripts/release/next-version.sh   which version would the next release have?
#   scripts/release/prepare.sh        the CHANGELOG.md section and the release notes
#   .github/workflows/release*.yml    through those two scripts, never directly
#
# Rules (owner decisions, Conventional Commits 1.0.0):
#   * while the major version is 0:  breaking change -> minor, `feat` -> minor, `fix`/`perf` -> patch;
#     every other type alone makes no release ("nothing to release", decided in next-version.sh)
#   * 1.0.0 is a manual decision (`--bump major` or an explicit version), never computed
#   * only stable tags `vX.Y.Z` count as "the previous release"; `-rc.N` tags are ignored here
#   * the release commit `chore(release): vX.Y.Z` and non-conventional commits (merge commits,
#     "Revert ..." generated by git) never appear in the output
#
# No network access is needed or used: pull-request numbers come from the "(#123)" that GitHub adds
# to a squash-merged title, and links are built from CLIFF_REPO_URL (default: the project's repository).

[changelog]
header = """
# Changelog

All notable changes to Ashdash are documented here. The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and the project follows [Semantic Versioning](https://semver.org/) (before 1.0, minor versions may change behaviour).
"""
# One section per release. The date is CLIFF_RELEASE_DATE (YYYY-MM-DD) when set, so that a run is reproducible;
# otherwise the day the section is generated. Group names carry a hidden sort prefix (stripped with `striptags`).
body = """
{%- set repo = get_env(name="CLIFF_REPO_URL", default="https://github.com/oh-my-productivity/ashdash") -%}
{%- if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ get_env(name="CLIFF_RELEASE_DATE", default=timestamp | date(format="%Y-%m-%d")) }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{%- if breaking | length > 0 %}
### Breaking changes
{% for commit in breaking %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}
{%- set text = commit.breaking_description | default(value=commit.message) | split(pat=" (PR#") -%}
{{ text | first | trim }}
{%- endfor %}
{% endif -%}
{%- for group, group_commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in group_commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.scope %}**{{ commit.scope }}**: {% endif %}
{%- set parts = commit.message | split(pat=" (PR#") -%}
{{ parts | first | trim }}
{%- if parts | length > 1 %} ([#{{ parts | last | trim_end_matches(pat=")") }}]({{ repo }}/pull/{{ parts | last | trim_end_matches(pat=")") }}))
{%- endif %} ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[bump]
# Major version 0: a breaking change bumps the minor version, `feat` bumps the minor version, everything else
# that releases bumps the patch version. From 1.0.0 on, a breaking change bumps the major version.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "0.1.0"

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = true
split_commits = false
require_conventional = false
topo_order = false
# Only tags that the current branch can reach count as releases.
use_branch_tags = true
sort_commits = "oldest"
# Stable releases only. Pre-release tags (v0.2.0-rc.1) are not "the previous release".
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"

commit_preprocessors = [
  # Squash-merge title suffix "(#123)" -> " (PR#123)", which the template turns into a link. Only the first line counts:
  # GitHub puts the pull request description below it.
  { pattern = '\A([^\n]*?)[ \t]*\(#([0-9]+)\)[ \t]*(\n|\z)', replace = "${1} (PR#${2})${3}" },
  # Never ping people from release notes.
  { pattern = '(^|[^`\w])@([A-Za-z0-9][A-Za-z0-9-]*)', replace = "${1}`@${2}`" },
]

commit_parsers = [
  # The bot's own commit and the housekeeping that it generates never show up.
  { message = '^chore\(release\)', skip = true },
  { message = '^feat', group = "<!-- 0 -->Added" },
  { message = '^fix', group = "<!-- 1 -->Fixed" },
  { message = '^perf', group = "<!-- 2 -->Performance" },
  { message = '^(refactor|revert)', group = "<!-- 3 -->Changed" },
  { message = '^docs', group = "<!-- 4 -->Documentation" },
  { message = '^(test|build|ci|chore|style)', group = "<!-- 5 -->Other" },
]
