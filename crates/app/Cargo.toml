[package]
name = "ashdash"
version = "0.1.0"
edition = "2024"
description = "Ashdash: a keyboard launcher for macOS (egui window, hotkeys, CLI)"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
egui_extras = { version = "0.36.2", features = ["file", "image"] }
global-hotkey = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSApplication", "NSResponder", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication", "NSBitmapImageRep", "NSImageRep", "NSWindow", "NSView", "NSVisualEffectView", "NSScreen", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSMenu", "NSMenuItem", "NSEvent", "NSImage", "NSColor", "NSGraphics", "NSAppearance", "objc2-quartz-core", "objc2-core-foundation"
] }
# Needed to name NSString/NSData/NSDictionary/NSBundle directly (already in the lock file via objc2-app-kit).
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSData", "NSArray", "NSDictionary", "NSGeometry", "NSObject", "NSObjCRuntime", "NSBundle", "NSAppleEventManager", "NSAppleEventDescriptor", "NSScriptCommand", "NSScriptCommandDescription", "NSError"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
ashdash-core = { version = "0.1.0", path = "../core" }
serde_json = "1.0.154"
winit = "0.30.13"
# Single-instance lock (flock), peer credentials (getpeereid) and process groups for the automation surface.
libc = "=0.2.190"
