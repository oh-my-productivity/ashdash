[package]
name = "ashdash-core"
version = "0.1.0"
edition = "2024"
description = "Ashdash core: query engine, providers, workflows and data stores (no UI)"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
plist = "1.10.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
thiserror = "2.0.21"
walkdir = "2.5.0"
zip = "9.0.3"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Property/fuzz tests (crates/core/tests/fuzz.rs). Minimal feature set: no fork/timeout helpers needed.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[[bench]]
name = "report"
harness = false

[[bench]]
name = "queries"
harness = false
